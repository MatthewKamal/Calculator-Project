<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <link href="./assets/styles/style.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <section>
        <div class="parentContainer">
          <input
            type="text"
            class="screen"
            placeholder="Result will appear here"
          />
          <div class="container">
            <button class="but1">Del</button>
            <button class="but2">
              <img src="./assets/images/√.png" alt="Root" />
            </button>
            <button class="but3">
              <img src="./assets/images/divison.png" alt="divison" />
            </button>
            <button class="but4">
              <img
                src="./assets/images/iconmonstr-x-mark-12 1.png"
                alt="undo"
              />
            </button>
            <button class="but5">1</button>
            <button class="but6">2</button>
            <button class="but7">3</button>
            <button class="but8">
              <img
                src="./assets/images/Multiplication.png"
                alt="multplication"
              />
            </button>
            <button class="but9">4</button>
            <button class="but10">5</button>
            <button class="but11">6</button>
            <button class="but12">
              <img src="./assets/images/-.png" alt="subtraction" />
            </button>
            <button class="but13">7</button>
            <button class="but14">8</button>
            <button class="but15">9</button>
            <button class="but16">
              <img src="./assets/images/+.png" alt="Summation" />
            </button>
            <button class="but17">.</button>
            <button class="but18">0</button>
            <button class="but19">
              <img src="./assets/images/=.png" alt="Equal" />
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="./assets/js/script.js"></script>
  </body>
</html>
